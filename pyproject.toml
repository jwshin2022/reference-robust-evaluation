[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "reference-robust-evaluation"
version = "0.4.0"
description = "Common-reference comparison of segmentation models with exact paired certificates"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{name = "Jee-Woo Shin"}, {name = "Chung-Pyo Hong"}]
dependencies = []
[project.optional-dependencies]
geometry = ["numpy>=1.24", "scipy>=1.10"]
[project.scripts]
reference-robust = "reference_robust.cli:main"
reference-robust-pair = "reference_robust.paired_cli:main"
[project.urls]
Repository = "https://github.com/jwshin2022/reference-robust-evaluation"
[tool.setuptools.packages.find]
where = ["src"]
include = ["reference_robust*"]
